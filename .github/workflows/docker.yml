name: Publish Docker images
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: ['master', 'nginx-1.23-php-8.1-sury', 'nginx-1.23-php-7.4', 'nginx-1.27-php-8.2', 'nginx-1.27-php-8.3-sury', 'nginx-1.29-php-8.4-sury', 'nginx-1.30-php-8.5-sury']
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ matrix.branch }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Docker image tag
        run: echo "DOCKER_IMAGE_BRANCH=${{ matrix.branch == 'master' && 'latest' || matrix.branch }}" >> $GITHUB_ENV
      - name: Push Docker
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_ACCOUNT }}/nginx-php:${{ env.DOCKER_IMAGE_BRANCH }}
            ghcr.io/${{ github.repository_owner }}/docker-nginx-php:${{ env.DOCKER_IMAGE_BRANCH }}
